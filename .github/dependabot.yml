version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
    # Enables only security updates:
    open-pull-requests-limit: 0

  - package-ecosystem: "npm"
    directory: "/api"
    schedule:
      interval: "weekly"
    # Enables only security updates:
    open-pull-requests-limit: 0

  - package-ecosystem: "docker"
    directory: "/ui"
    schedule:
      interval: "weekly"
    # Enables only security updates:
    open-pull-requests-limit: 0

  - package-ecosystem: "docker"
    directory: "/api"
    schedule:
      interval: "weekly"
    # Enables only security updates:
    open-pull-requests-limit: 0
